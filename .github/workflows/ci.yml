name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push on the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sre_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway CI database; integration tests refuse names not ending in _test.
      DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/sre_test
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-password@localhost:5432/sre_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (unit and integration)
        run: pytest

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 10, bundled with Node 22, crashes resolving vitest's peer dependencies.
      - name: Use npm 11
        run: npm install -g npm@11.21.0
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build backend image
        run: docker build --tag ai-sre-assistant-backend:ci backend
      - name: Build frontend image
        run: docker build --tag ai-sre-assistant-frontend:ci frontend
