server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the backend container: the browser sees a single origin (no CORS).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health/ {
        proxy_pass http://api:8000;
    }

    # The ingest endpoint is for the simulator only (container network), not browsers.
    location /api/v1/ingest/ {
        return 404;
    }

    # Hashed asset names never change content: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/incidents/..., /services/...) all serve the app.
    location / {
        try_files $uri /index.html;
    }
}
